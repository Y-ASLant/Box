name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '12.4.2'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - name: Validate tag and release notes
        run: pnpm run release:notes "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release-notes.md"

      - name: Run tests, static checks, and renderer build
        run: pnpm run build

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            script: build:win:x64
            artifact: windows-x64
          - name: macOS x64
            runner: macos-15-intel
            script: build:mac:x64
            artifact: macos-x64
          - name: macOS arm64
            runner: macos-latest
            script: build:mac:arm64
            artifact: macos-arm64
          - name: Linux x64
            runner: ubuntu-24.04
            script: build:linux:x64
            artifact: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            script: build:linux:arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Build package
        run: pnpm run ${{ matrix.script }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: box-${{ github.ref_name }}-${{ matrix.artifact }}
          path: |
            build/*.exe
            build/*.dmg
            build/*.AppImage
            build/*.deb
            build/*.rpm
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo '没有找到可发布的安装包' >&2
            exit 1
          fi

          release_flags=(--latest)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --title "Box ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${release_flags[@]}"
