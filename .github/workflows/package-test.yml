name: Package Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '12.4.2'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            script: build:win:x64
            artifact: windows-x64
          - name: macOS x64
            runner: macos-15-intel
            script: build:mac:x64
            artifact: macos-x64
          - name: macOS arm64
            runner: macos-latest
            script: build:mac:arm64
            artifact: macos-arm64
          - name: Linux x64
            runner: ubuntu-24.04
            script: build:linux:x64
            artifact: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            script: build:linux:arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Build package
        run: pnpm run ${{ matrix.script }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: box-package-test-${{ github.run_id }}-${{ matrix.artifact }}
          path: |
            build/*.exe
            build/*.dmg
            build/*.AppImage
            build/*.deb
            build/*.rpm
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
