name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '12.4.2'

jobs:
  check:
    name: Check workflows and application
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/repo" --workdir /repo rhysd/actionlint:1.7.12

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - name: Validate changelog release notes
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm run release:notes "v${version}" "${RUNNER_TEMP}/release-notes.md"

      - name: Run tests, static checks, and renderer build
        run: pnpm run build
