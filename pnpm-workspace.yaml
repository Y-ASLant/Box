overrides:
  rimraf: 6.1.3
autoInstallPeers: false
peerDependencyRules:
  ignoreMissing:
    - electron-builder-squirrel-windows

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@chakra-ui/react@3.37.0'
  - '@vitejs/plugin-react@6.1.1'
  - react@19.3.0
  - react-dom@19.3.0
